<!DOCTYPE html>
<html>

<head>

    <title>Login | AI Form Studio</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">

</head>

<body>


    <div class="auth-container">


        <div class="auth-logo">

            <h1>
                AI <span>Form Studio</span>
            </h1>

        </div>



        <h2>
            Welcome Back
        </h2>

{% if error %}

<div class="error-message">

    {{ error }}

</div>

{% endif %}

        <form method="POST">


            <div class="form-group">

                <label>Email</label>

                <input type="email" name="email" placeholder="Enter your email" required>

            </div>



           <div class="form-group">

    <label>Password</label>


    <div class="password-wrapper">

        <input 
            id="login-password"
            type="password"
            name="password"
            placeholder="Enter your password"
            required>


        <button 
            type="button"
            class="show-password"
            onclick="togglePassword()">

            👁

        </button>


    </div>


</div>



            <button class="auth-btn">

                Login

            </button>



        </form>



        <div class="auth-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>



    </div>
<script>

function togglePassword(){

    const password =
    document.getElementById(
        "login-password"
    );


    const button =
    document.querySelector(
        ".show-password"
    );


    if(password.type === "password"){


        password.type="text";


        button.innerHTML="🙈";


    }

    else{


        password.type="password";


        button.innerHTML="👁";


    }

}

</script>

</body>

</html>
